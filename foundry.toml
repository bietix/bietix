[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 100
fail_on_revert = false

# Corrida larga (nocturna / antes de cada release): FOUNDRY_PROFILE=ci forge test
[profile.ci.fuzz]
runs = 20000

[profile.ci.invariant]
runs = 2000
depth = 200
fail_on_revert = false

[fmt]
line_length = 110

[lint]
# block-timestamp: el OracleGuard necesita block.timestamp para medir la antigüedad de los precios
# y el período de gracia del sequencer. Una variación de pocos segundos no afecta esos controles
# (los márgenes son de minutos u horas), así que el aviso no aplica.
exclude_lints = ["block-timestamp"]
# El linter se aplica al código de los contratos (src/). Las pruebas usan patrones propios de testing.
ignore = ["test/**/*.sol"]

[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"

[etherscan]
arbitrum = { key = "${ETHERSCAN_API_KEY}", chain = 42161 }
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 421614 }
