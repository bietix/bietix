[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 100
fail_on_revert = false

# Corrida larga (nocturna / antes de cada release): FOUNDRY_PROFILE=ci forge test
[profile.ci.fuzz]
runs = 20000

[profile.ci.invariant]
runs = 2000
depth = 200
fail_on_revert = false

[fmt]
line_length = 110
